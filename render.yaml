services:
  - type: web
    name: bullrun-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python api.py
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: FRONTEND_URL
        sync: false
