name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run risk engine tests
        run: python -m pytest test_risk_engine.py -v
      - name: Compile check
        run: python -m py_compile api.py orchestrator.py monitor.py execution.py agents/risk_engine.py agents/quant_agent.py agents/scout_agent.py agents/cio_agent.py
